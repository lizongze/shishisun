  · 本文件自包含：双击即可打开，不依赖本地服务器、不依赖其他页面。

<script>
/*
  Babel 8 的 preset-react 默认用 automatic runtime，会编译成 import { jsx } from "react/jsx-runtime"，
  在 classic <script> 里直接报错（页面空白）。这里注册一个 classic runtime 的预设，页面统一用
  data-presets="react-classic"。Babel 7 及以下不需要这段，升级时别忘了它。
*/
if (!Babel.availablePresets['react-classic']) {
  Babel.registerPreset('react-classic', { presets: [[Babel.availablePresets.react, { runtime: 'classic' }]] });
}
</script>

<style id="shell-style">
/* ===== 壳层基础样式（框架 A：顶栏 54 + 侧栏 200 / 内容 24） ===== */

<body>
<div id="root"></div>

<script>
/*
  antd 的 UMD 包不含语言包，这里异步加载官方 zh_CN（失败或超时自动退回英文，不阻塞页面）。
  用 esm.sh 取官方 locale 模块；不要换 jsDelivr 的 +esm，它在 file:// 下会抛 TypeError。
*/
window.__ANTD_LOCALE_READY = new Promise(function (resolve) {
  var done = false;
  var finish = function (locale) { if (!done) { done = true; resolve(locale || null); } };
  setTimeout(function () { finish(null); }, 8000);
  try {
    import('https://esm.sh/antd@6.6.8/locale/zh_CN')
      .then(function (mod) { finish(mod.default || mod); })
      .catch(function () { finish(null); });
  } catch (err) { finish(null); }
});
</script>

<script type="text/babel" data-presets="react-classic">
/* =========================================================================
   共享层：依赖解构 → 主题 → 壳（Shell）→ 格式化与状态助手
   这一段由模板统一维护。页面只写「PAGE CODE」区域。
   代码风格：组件一律箭头函数 `const Xxx = (props) => …`；单一 return 用表达式体，含 hooks 或局部变量用块体。
   ========================================================================= */
const {
  ConfigProvider, App: AntApp, Layout, Menu, Breadcrumb, Dropdown, Avatar,
  Button, Space, Tag, Typography, Divider, Empty, Skeleton, Result, message, Modal, notification,
  Card, Table, Input, InputNumber, Select, DatePicker, Form, Radio, Checkbox, Switch, Upload,
  Tooltip, Popconfirm, Popover, Drawer, Tabs, Steps, Descriptions, Badge, Progress, Alert,
  Row, Col, Spin, Segmented, List, Statistic, Timeline, Collapse, Image
} = antd;
const { Header, Sider, Content } = Layout;
const { useState, useEffect, useMemo, useRef, useCallback } = React;
const icons = window.icons || {};

/* ---------- 应用元信息与导航（由 scripts/scaffold.mjs 注入，新增页面时同步） ---------- */
const APP = { title: '__APP_TITLE_JS__', short: '__APP_SHORT__', role: '__ROLE__', file: '__PAGE_FILE__' };
const NAV = __NAV_JSON__;
const ACTIVE = '__ACTIVE_KEY__';

/* ---------- 调色板：换项目 UI 规范时，改这里 + 上面的 TOKENS 块（两处保持一致） ---------- */
const UI = {
  primary1: '#E8F3FF',
  primary2: '#BEDAFF',
  primary3: '#94BFFF',
  primary5: '#4080FF',
  primary6: '#165DFF',
  primary7: '#0E42D2',
  success1: '#E8FFEA',
  success6: '#00B42A',
  warning1: '#FFF7E8',
  warning6: '#FF7D00',
  danger1: '#FFECE8',
  danger6: '#F53F3F',
  text1: '#1D2129',
  text2: '#4E5969',
  text3: '#86909C',
  text4: '#C9CDD4',
  border1: '#F2F3F5',
  border2: '#E5E6EB',
  fill1: '#F7F8FA',
  fill2: '#F2F3F5',
  white: '#FFFFFF',
  headerHeight: 54,
  siderWidth: 200
};

/* ---------- antd 主题：把 UI 规范 Token 映射到 antd 6（值来自上面的 UI 调色板） ---------- */
const THEME = {
  token: {
    colorPrimary: UI.primary6,
    colorPrimaryHover: UI.primary5,
    colorPrimaryActive: UI.primary7,
    colorPrimaryBg: UI.primary1,
    colorPrimaryBgHover: UI.primary2,
    colorPrimaryBorder: UI.primary3,
    colorSuccess: UI.success6,
    colorWarning: UI.warning6,
    colorError: UI.danger6,
    colorInfo: UI.primary6,
    colorLink: UI.primary6,
    colorLinkHover: UI.primary5,
    colorText: UI.text1,
    colorTextSecondary: UI.text2,
    colorTextTertiary: UI.text3,
    colorTextQuaternary: UI.text4,
    colorTextDescription: UI.text3,
    colorBorder: UI.border2,
    colorBorderSecondary: UI.border1,
    colorBgLayout: UI.fill1,
    colorBgContainer: UI.white,
    colorFillSecondary: UI.fill2,
    colorFillTertiary: UI.fill1,
    colorFillQuaternary: UI.fill1,
    borderRadius: 2,
    borderRadiusSM: 2,
    borderRadiusLG: 4,
    borderRadiusXS: 2,
    controlHeight: 32,
    controlHeightSM: 28,
    controlHeightLG: 36,
    fontSize: 14,
    fontSizeSM: 12,
    fontSizeLG: 16,
    lineHeight: 22 / 14,
    fontFamily: "Inter, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif",
    boxShadow: '0 2px 5px rgba(0,0,0,.1)',
    boxShadowSecondary: '0 2px 5px rgba(0,0,0,.1)',
    motionDurationFast: '0.1s',
    motionDurationMid: '0.2s',
    motionDurationSlow: '0.3s',
    padding: 16,
    paddingLG: 24,
    paddingSM: 12,
    paddingXS: 8,
    margin: 16,
    marginLG: 24,
    marginSM: 12,
    marginXS: 8
  },
  components: {
    Layout: {
      headerHeight: UI.headerHeight,
      headerPadding: '0 24px',
      headerBg: UI.white,
      siderBg: UI.white,
      bodyBg: UI.fill1,
      triggerBg: UI.white,
      triggerColor: UI.text2
    },
    Menu: {
      itemHeight: 40,
      itemMarginInline: 8,
      itemMarginBlock: 2,
      itemBorderRadius: 2,
      itemColor: UI.text2,
      itemHoverBg: UI.fill2,
      itemHoverColor: UI.text1,
      itemSelectedBg: UI.primary1,
      itemSelectedColor: UI.primary6,
      subMenuItemBg: UI.white,
      iconSize: 16,
      collapsedIconSize: 16
    },
    Table: {
      headerBg: UI.fill2,
      headerColor: UI.text1,
      headerSplitColor: UI.border2,
      borderColor: UI.border2,
      rowHoverBg: UI.fill1,
      cellPaddingBlock: 12,
      cellPaddingBlockMD: 7,
      cellPaddingBlockSM: 4,
      cellPaddingInline: 16,
      headerBorderRadius: 0
    },
    Card: { borderRadiusLG: 4, paddingLG: 16, headerFontSize: 16, headerHeight: 48 },
    Button: { paddingInline: 16, primaryShadow: 'none', defaultShadow: 'none', dangerShadow: 'none', fontWeight: 400 },
    Modal: { borderRadiusLG: 4, titleFontSize: 16 },
    Drawer: { paddingLG: 24 },
    Form: {
      labelColor: UI.text2,
      itemMarginBottom: 24,
      verticalLabelPadding: '0 0 12px'
    },
    Tabs: { horizontalItemPadding: '12px 0', horizontalItemGutter: 24, titleFontSize: 14 },
    Tag: { defaultBg: UI.fill2, defaultColor: UI.text2 },
    Descriptions: { labelColor: UI.text3, contentColor: UI.text1 },
    Pagination: { itemSize: 32, itemSizeSM: 28 }
  }
};

/* ---------- 格式化助手（10.5 数值/日期/单位口径） ---------- */
const money = (value) => '¥' + Number(value || 0).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const num = (value) => Number(value || 0).toLocaleString('zh-CN');
const fmtDate = (value, pattern) => (value ? dayjs(value).format(pattern || 'YYYY-MM-DD') : '—');
const fmtDateTime = (value) => (value ? dayjs(value).format('YYYY-MM-DD HH:mm') : '—');

/* ---------- 业务状态色（5.1.5：浅底 + 深色字，颜色不是唯一编码） ---------- */
const TONE = {
  primary: { color: UI.primary6, bg: UI.primary1 },
  success: { color: UI.success6, bg: UI.success1 },
  warning: { color: UI.warning6, bg: UI.warning1 },
  danger: { color: UI.danger6, bg: UI.danger1 },
  info: { color: UI.text2, bg: UI.fill2 }
};
const ToneTag = ({ tone, children }) => {
  const t = TONE[tone] || TONE.info;
  return <Tag style={{ color: t.color, background: t.bg, borderColor: 'transparent', marginInlineEnd: 0 }}>{children}</Tag>;
};

/* ---------- 导航图标：按名称取 @ant-design/icons，缺省回落 ---------- */
const IconOf = ({ name, style }) => {
  const Cmp = icons[name] || icons.AppstoreOutlined;
  return Cmp ? <Cmp style={style || { fontSize: 16 }} /> : null;
};

/* ---------- 页面标题区（4.1.3：标题 20/28 + 说明 text-3 + 操作在右上角） ---------- */
const PageHeader = ({ title, desc, extra }) => (
  <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', gap: 16, marginBottom: 20 }}>
    <div style={{ minWidth: 0 }}>
      <div style={{ fontSize: 20, lineHeight: '28px', fontWeight: 500, color: 'var(--ui-text-1)' }}>{title}</div>
      {desc ? <div style={{ fontSize: 14, lineHeight: '22px', color: 'var(--ui-text-3)', marginTop: 4 }}>{desc}</div> : null}
    </div>
    {extra ? <Space size={8} style={{ flex: 'none' }}>{extra}</Space> : null}
  </div>
);

/* ---------- 应用壳（框架 A）：顶栏 54 + 侧栏 200 + 内容区 ---------- */
const Shell = ({ title, desc, extra, children }) => {
  const { message } = AntApp.useApp();
  /* 多角色应用：nav 项可带 roles（如 ["管理员"]），只对白名单角色显示；不带 roles 表示所有角色可见 */
  const visibleNav = NAV.filter((item) => !item.roles || item.roles.includes(APP.role));
  const items = visibleNav.map((item) => ({
    key: item.key,
    icon: <IconOf name={item.icon} />,
    label: item.label
  }));
  const go = ({ key }) => {
    const target = NAV.find((item) => item.key === key);
    if (target && target.href) window.location.href = target.href;
  };
  return (
    <Layout style={{ minHeight: '100vh' }}>
      <Header className="ui-header" style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
        <div className="ui-brand">
          <span className="ui-brand-mark">{APP.short.slice(0, 1)}</span>
          <span>{APP.title}</span>
          <Tag style={{ marginInlineStart: 4, color: 'var(--ui-text-3)', background: 'var(--ui-fill-2)', borderColor: 'transparent' }}>原型</Tag>
        </div>
        <Space size={12}>
          <span style={{ fontSize: 13, color: 'var(--ui-text-3)' }}>当前角色：{APP.role}</span>
          <Dropdown
            menu={{
              items: [{ key: 'profile', label: '个人信息' }, { key: 'logout', label: '退出登录（回原型目录）' }],
              onClick: ({ key }) => {
                if (key === 'logout') window.location.href = 'index.html';
                else message.info('原型未实现个人信息');
              }
            }}
            trigger={['click']}
          >
            <Avatar size={28} style={{ background: 'var(--ui-primary-6)', cursor: 'pointer' }}>{(APP.role || '用').slice(0, 1)}</Avatar>
          </Dropdown>
        </Space>
      </Header>
      <Layout>
        <Sider className="ui-sider" width={UI.siderWidth} theme="light">
          <Menu
            mode="inline"
            selectedKeys={[ACTIVE]}
            items={items}
            onClick={go}
            style={{ borderInlineEnd: 'none', paddingTop: 8, flex: '1 1 auto', overflowY: 'auto' }}
          />
          <div className="ui-sider-foot">
            <a href="index.html">← 返回原型目录</a>
          </div>
        </Sider>
        <Content style={{ padding: 'var(--ui-content-padding)', background: 'var(--ui-page-bg)', overflow: 'auto' }}>
          <div style={{ maxWidth: 'var(--ui-reading-max-width)' }}>
            <PageHeader title={title} desc={desc} extra={extra} />
            {children}
          </div>
        </Content>
      </Layout>
    </Layout>
  );
};

/* =========================================================================
   PAGE CODE START —— 以下是本页独有代码，改页面只改这一段
   约定：MOCK（数据）→ 子组件 → Page（主组件）→ 渲染出口
   风格：组件一律箭头函数 const Xxx = (props) => …；单一 return 用表达式体，含 hooks/局部变量用块体
   ========================================================================= */

const Page = () => (
  <Shell title="__PAGE_TITLE__" desc="页面说明待补充">
    <Empty description="页面待实现" />
  </Shell>
);

/* =========================================================================
   PAGE CODE END
   ========================================================================= */

const root = ReactDOM.createRoot(document.getElementById('root'));
window.__ANTD_LOCALE_READY.then((locale) => {
  root.render(
    <ConfigProvider locale={locale} theme={THEME}>
      <AntApp>
        <Page />
      </AntApp>
    </ConfigProvider>
  );
});
</script>
